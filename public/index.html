<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kit Emprendedores - Iniciar Sesion</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e7f0fa 0%, #f4f7f6 55%, #dfeafa 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .login-container {
            background: white;
            padding: 2.3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 86, 179, 0.12);
            width: 100%;
            max-width: 410px;
        }
        .brand-mark {
            width: 56px; height: 56px; margin: 0 auto 1rem;
            border-radius: 16px; display: grid; place-items: center;
            background: linear-gradient(135deg, #0056b3, #0a74da);
            color: white; font-size: 1.6rem; font-weight: 800;
            box-shadow: 0 6px 14px rgba(0, 86, 179, 0.3);
        }
        h2 { text-align: center; color: #1f2933; margin: 0 0 .3rem; }
        .subtitle { text-align: center; color: #5b6770; font-size: 0.9rem; margin: 0 0 1.6rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.35rem; color: #3e4c59; font-size: 0.88rem; font-weight: 600; }
        input {
            width: 100%; padding: 0.72rem 0.9rem; border: 1px solid #cbd5df;
            border-radius: 8px; font-size: 0.98rem; font-family: inherit;
        }
        input:focus { outline: none; border-color: #0056b3; box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.15); }
        button[type="submit"] {
            width: 100%; padding: 0.85rem; margin-top: .4rem; background-color: #0056b3;
            color: white; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        button[type="submit"]:hover { background-color: #004494; }
        .demo-box { margin-top: 1.3rem; padding-top: 1rem; border-top: 1px solid #e3e8ee; }
        .demo-title { font-size: 0.78rem; color: #5b6770; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 .6rem; font-weight: 700; }
        .demo-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
        .demo-btn {
            background: #eef4fb; color: #0056b3; border: 1px solid #cde0f5;
            border-radius: 8px; padding: .5rem; font-size: .82rem; font-weight: 600; cursor: pointer;
        }
        .demo-btn:hover { background: #dcebfa; }
        #error-message {
            color: #8a1c1c; background: #fdecea; border-radius: 8px; padding: .65rem .9rem;
            text-align: center; margin-top: 1rem; font-size: 0.9rem; display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-mark">K</div>
        <h2>Kit Emprendedores</h2>
        <p class="subtitle">PostgreSQL (RLS) · Redis · MongoDB ETL</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="tenant_id">Negocio (Tenant ID)</label>
                <input type="number" id="tenant_id" min="1" value="1" required>
            </div>
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="Ej. admin, gerente, cajero">
            </div>
            <div class="form-group">
                <label for="password">Contrasena</label>
                <input type="password" id="password" required placeholder="Ingresa tu contrasena">
            </div>
            <button type="submit">Ingresar</button>
            <div id="error-message"></div>
        </form>

        <div class="demo-box">
            <p class="demo-title">Acceso rapido por rol (Tenant 1)</p>
            <div class="demo-btns">
                <button type="button" class="demo-btn" data-u="admin" data-p="admin123">Administrador</button>
                <button type="button" class="demo-btn" data-u="gerente" data-p="gerente123">Gerente</button>
                <button type="button" class="demo-btn" data-u="cajero" data-p="cajero123">Cajero</button>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.demo-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.getElementById('tenant_id').value = '1';
                document.getElementById('username').value = btn.dataset.u;
                document.getElementById('password').value = btn.dataset.p;
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tenant_id = Number(document.getElementById('tenant_id').value);
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenant_id, username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = data.error || 'Error de autenticacion';
                }
            } catch (err) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'No se pudo conectar con el servidor.';
            }
        });
    </script>
</body>
</html>
